[package]
name = "novaforge-ai-empire"
version = "0.1.0"
edition = "2021"
authors = ["NovaForge Team"]
description = "Clean Consciousness Evolution System with Quantum Features for Multi-Chain AI Empire"
repository = "https://github.com/Infinite-88/NovaSphere-Tech"
license = "MIT"
keywords = ["consciousness", "quantum", "blockchain", "ai", "evolution"]
categories = ["science", "cryptography", "simulation"]

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Cryptography for quantum operations
rand = "0.8"
sha2 = "0.10"

# Async traits
async-trait = "0.1"

# UUID for token IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "novaforge"
path = "src/bin/main.rs"

[lib]
name = "novaforge_ai_empire"
path = "src/lib.rs"